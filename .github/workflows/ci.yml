name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - run: go vet ./...
      - shell: bash
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o migrate ./cmd/migrate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t migration-kit-test .
      - run: docker run --rm migration-kit-test
      - run: docker build --target release -t migration-kit:ci .
